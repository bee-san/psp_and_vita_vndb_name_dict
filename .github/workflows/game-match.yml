name: Game matching report (experiment)

on:
  push:
    branches: [experiment/title-id-coverage]
    paths: [tools/game_match_report.py, .github/workflows/game-match.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match VNDB games to Vita title IDs and titles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/game_match_report.py
      - name: Commit the report to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Game matching report" -m "Generated by game-match.yml" || exit 0
          git push origin HEAD:${{ github.ref_name }}
