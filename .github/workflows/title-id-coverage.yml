name: Title ID coverage (experiment)

on:
  push:
    branches: [experiment/title-id-coverage]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Title IDs from VNDB catalog numbers and PlayStation Store links
        run: python tools/title_id_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: title-id-coverage
          path: title-id-coverage.json
          retention-days: 7
